apiVersion: apps/v1
kind: Deployment
metadata:
  name: identidade-api
  namespace: postechallenge
  labels:
    app: identidade-api
    tags.datadoghq.com/service: identidade-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identidade-api
  template:
    metadata:
      labels:
        app: identidade-api
        tags.datadoghq.com/service: identidade-service
      annotations:
        # O admission controller do Datadog injeta o tracer .NET a partir deste
        # label, sem tocar no Dockerfile. É a observabilidade da Fase 3
        # reaproveitada, como o enunciado pede.
        admission.datadoghq.com/dotnet-lib.version: v3.7.0
    spec:
      containers:
        - name: identidade-api
          image: postechacr13soat.azurecr.io/identidade-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SqlConnectionString
              valueFrom:
                secretKeyRef:
                  name: identidade-service-secrets
                  key: sql-connection-string
            # O mesmo segredo JWT da Fase 3, que mora no Key Vault: é o que a
            # política validate-jwt do APIM confere.
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: identidade-service-secrets
                  key: jwt-secret-key
            - name: Jwt__Issuer
              value: PosTechChallenge
            - name: Jwt__Audience
              value: PosTechChallenge-API
          resources:
            # 150m por réplica, como na Fase 3: a quota regional é de 4 vCPU e
            # agora são quatro serviços dividindo o mesmo teto.
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            # Separado do liveness: o pod sobe antes de o consumidor conectar no
            # broker, e mandar tráfego nesse intervalo dá erro à toa.
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identidade-api
  namespace: postechallenge
spec:
  type: ClusterIP
  selector:
    app: identidade-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identidade-api
  namespace: postechallenge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identidade-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120

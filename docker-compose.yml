# Infraestrutura local do Identidade: só o SQL Server.
#
#   docker compose up -d
#
# Na nuvem o equivalente é o Azure SQL (identidade-db), provisionado pelo
# postech-infra-db.

name: postech-identidade

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: postech-identidade-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env}"
      MSSQL_PID: Developer
    ports:
      - "${SQL_HOST_PORT:-1433}:1433"
    volumes:
      - identidade-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -No -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 120s
    security_opt:
      - no-new-privileges:true

volumes:
  identidade-sql-data:
